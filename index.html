<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMMyE</title>

    <!-- Favicon SMMyE (logo en la pestaña) -->
    <link rel="icon" type="image/png" href="/smmye-app/img/logo_smmye.png">
    <link rel="icon" href="/smmye-app/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/smmye-app/img/logo_smmye.png">

    <!-- Script inline: aplica tema ANTES de renderizar para evitar flash -->
    <script>
        (function() {
            try {
                var s = localStorage.getItem('SensorSesion');
                var theme = s ? (JSON.parse(s).theme || 'dark') : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Fuentes tech (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fuentes diseño Agro-Intelligence (Plus Jakarta Sans + Inter) + Material Symbols -->
